name: rick_morty_explorer
description: Rick & Morty Character Explorer - Latihan Responsi Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management, route & dependency management
  get: ^4.6.6
  # HTTP request ke API (Modul V)
  http: ^1.2.0
  # Shared Preferences untuk session & data favorit 
  shared_preferences: ^2.2.2
  # Hive sebagai local database untuk user 
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
